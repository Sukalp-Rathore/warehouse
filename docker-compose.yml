services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: wms_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    env_file:
      - .env
    ports:
      - "9000:9000"

  webserver:
    image: nginx:latest
    container_name: wms_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
